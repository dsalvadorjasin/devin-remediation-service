# Placeholder values only. Create the real secret out of band, e.g.
#   kubectl -n devin-remediation create secret generic remediation-secrets \
#     --from-env-file=.env
# and drop this file from kustomization.yaml (or use an ExternalSecret).
apiVersion: v1
kind: Secret
metadata:
  name: remediation-secrets
type: Opaque
stringData:
  GITHUB_TOKEN: your_github_token_here
  DEVIN_API_KEY: your_devin_api_key_here
  DEVIN_ORG_ID: your_devin_org_id_here
  GITHUB_WEBHOOK_SECRET: your_webhook_secret_here
  INGEST_TOKEN: your_ingest_token_here
