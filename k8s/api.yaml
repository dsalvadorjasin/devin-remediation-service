apiVersion: v1
kind: Service
metadata:
  name: remediation-api
spec:
  selector: {app: remediation-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-api
  labels: {app: remediation-api, tier: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: remediation-api}
  template:
    metadata:
      labels: {app: remediation-api, tier: api}
    spec:
      initContainers:
        - name: wait-for-migrations
          image: devin-remediation-service
          command: [sh, -c, "until uv run alembic current 2>/dev/null | grep -q '(head)'; do echo waiting for migrations; sleep 5; done"]
          envFrom:
            - configMapRef: {name: remediation-config}
            - secretRef: {name: remediation-secrets}
      containers:
        - name: api
          image: devin-remediation-service
          command: [uv, run, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: remediation-config}
            - secretRef: {name: remediation-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
---
# Expose publicly (GitHub webhooks + semgrep.yml POST /ingest/semgrep need to reach it).
# TLS is mandatory: the webhook HMAC secret and INGEST_TOKEN travel in these requests.
# Supply the certificate in `remediation-api-tls` (or let cert-manager issue it via
# the annotation below); plain HTTP is redirected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remediation-api
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts: [remediation.example.com]
      secretName: remediation-api-tls
  rules:
    - host: remediation.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: remediation-api, port: {number: 80}}
