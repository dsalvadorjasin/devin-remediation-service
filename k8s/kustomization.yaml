apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devin-remediation
resources:
  - namespace.yaml
  - configmap.yaml
  # remediation-secrets is NOT part of the base: create it out of band
  # (see README / secret.example.yaml) before applying.
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - api.yaml
  - ingest-worker.yaml
  - devin-worker.yaml
  - beat.yaml
# Manifests reference the placeholder image `devin-remediation-service`; the
# real registry path and an immutable tag/digest are set per release by
# k8s/deploy.sh (never `latest`: re-applying `:latest` does not change the pod
# templates, so nothing would roll).
