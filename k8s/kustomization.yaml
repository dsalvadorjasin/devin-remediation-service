apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devin-remediation
resources:
  - namespace.yaml
  - configmap.yaml
  # remediation-secrets is NOT part of the base: create it out of band
  # (see README / secret.example.yaml) before applying.
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - api.yaml
  - ingest-worker.yaml
  - devin-worker.yaml
  - beat.yaml
images:
  - name: devin-remediation-service
    newName: ghcr.io/dsalvadorjasin/devin-remediation-service
    newTag: latest
