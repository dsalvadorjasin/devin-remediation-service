apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: remediation}
            - {name: POSTGRES_DB, value: remediation}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: remediation-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: [pg_isready, -U, remediation, -d, remediation]}
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
