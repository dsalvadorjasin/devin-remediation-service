apiVersion: batch/v1
kind: Job
metadata:
  name: remediation-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: devin-remediation-service
          command: [uv, run, alembic, upgrade, head]
          envFrom:
            - configMapRef: {name: remediation-config}
            - secretRef: {name: remediation-secrets}
