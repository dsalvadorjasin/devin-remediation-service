[project]
name = "devin-remediation-service"
version = "0.1.0"
description = "An event-driven automation that scans a GitHub repository for issues labelled devin-remediate and spins up Devin sessions to fix them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "jinja2==3.1.4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "celery[redis]>=5.4,<6",
    "redis>=5,<7",
    "semgrep>=1.139,<2",
    "prometheus-client>=0.20,<1",
    "prometheus-fastapi-instrumentator>=7,<8",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]

[dependency-groups]
dev = [
    "fakeredis>=2.23,<3",
    "mypy>=1.10,<2",
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-httpx==0.30.0",
    "pyyaml>=6,<7",
    "ruff>=0.6,<1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "e2e", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",  # line length: enforced by the formatter's judgement, not lint
    "B008",  # FastAPI Depends()/Query() in defaults
    "SIM105",  # contextlib.suppress is less readable than try/except/pass here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "SIM117"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["frontend/", "e2e/", "alembic/"]
