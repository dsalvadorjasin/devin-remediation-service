apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-ingest-worker
  labels: {app: remediation-ingest-worker, tier: worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: remediation-ingest-worker}
  template:
    metadata:
      labels: {app: remediation-ingest-worker, tier: worker}
    spec:
      initContainers:
        - name: wait-for-migrations
          image: devin-remediation-service
          command: [sh, -c, "until uv run alembic current 2>/dev/null | grep -q '(head)'; do echo waiting for migrations; sleep 5; done"]
          envFrom:
            - configMapRef: {name: remediation-config}
            - secretRef: {name: remediation-secrets}
      containers:
        - name: worker
          image: devin-remediation-service
          command: [uv, run, celery, -A, "app.celery_app:celery_app", worker, -Q, ingest, -n, "ingest@%h", --loglevel=info, --concurrency=2]
          envFrom:
            - configMapRef: {name: remediation-config}
            - secretRef: {name: remediation-secrets}
          volumeMounts:
            - {name: checkout, mountPath: /checkout}
          livenessProbe:
            exec:
              command: [sh, -c, 'uv run celery -A app.celery_app:celery_app inspect ping -d "ingest@$HOSTNAME" --timeout 10']
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests: {cpu: 500m, memory: 1Gi}
      volumes:
        - name: checkout
          emptyDir: {}
