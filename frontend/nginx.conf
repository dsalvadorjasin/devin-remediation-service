server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Read API (contracts/read-api.openapi.yaml) proxied to the FastAPI service.
    location = /status { proxy_pass ${API_UPSTREAM}; }
    location ^~ /status/ { proxy_pass ${API_UPSTREAM}; }
    location = /healthz { proxy_pass ${API_UPSTREAM}; }
}
