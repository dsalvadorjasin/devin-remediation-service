apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
# Broker + result backend. Queued Celery messages (remediations, delayed polls,
# forced retries) live here until a worker consumes them, so Redis runs as a
# StatefulSet with AOF persistence on a PVC: a pod replacement keeps the queue.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [--appendonly, "yes", --appendfsync, everysec]
          ports: [{containerPort: 6379}]
          volumeMounts:
            - {name: redisdata, mountPath: /data}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: {name: redisdata}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
