# Placeholder values only — deliberately NOT referenced by kustomization.yaml, so
# `kubectl apply -k k8s/` never installs these publicly known values. Create the
# real secret out of band, e.g.
#   kubectl -n devin-remediation create secret generic remediation-secrets \
#     --from-env-file=.env
# or via an ExternalSecret / sealed secret with the same name and keys.
apiVersion: v1
kind: Secret
metadata:
  name: remediation-secrets
type: Opaque
stringData:
  GITHUB_TOKEN: your_github_token_here
  DEVIN_API_KEY: your_devin_api_key_here
  DEVIN_ORG_ID: your_devin_org_id_here
  GITHUB_WEBHOOK_SECRET: your_webhook_secret_here
  INGEST_TOKEN: your_ingest_token_here
