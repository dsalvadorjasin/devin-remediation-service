apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-devin-worker
  labels: {app: remediation-devin-worker, tier: worker}
spec:
  replicas: 2
  selector:
    matchLabels: {app: remediation-devin-worker}
  template:
    metadata:
      labels: {app: remediation-devin-worker, tier: worker}
    spec:
      initContainers:
        - name: wait-for-migrations
          image: devin-remediation-service
          command: [sh, -c, "until uv run alembic current 2>/dev/null | grep -q '(head)'; do echo waiting for migrations; sleep 5; done"]
          envFrom:
            - configMapRef: {name: remediation-config}
            - secretRef: {name: remediation-secrets}
      containers:
        - name: worker
          image: devin-remediation-service
          command: [uv, run, celery, -A, "app.celery_app:celery_app", worker, -Q, devin, -n, "devin@%h", --loglevel=info, --concurrency=4]
          envFrom:
            - configMapRef: {name: remediation-config}
            - secretRef: {name: remediation-secrets}
          livenessProbe:
            exec:
              command: [sh, -c, 'uv run celery -A app.celery_app:celery_app inspect ping -d "devin@$HOSTNAME" --timeout 10']
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests: {cpu: 100m, memory: 256Mi}
