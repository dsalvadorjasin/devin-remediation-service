# Service topology (all app containers are built from the same image):
#
#   api            FastAPI ingest/API + dashboard        (:8000)  never calls Devin
#   ingest-worker  celery -Q ingest   scan_task, discovery_task (GitHub, Semgrep)
#   devin-worker   celery -Q devin    remediate_issue_task, poll_session_task
#   beat           celery beat        reconciliation scan + Semgrep discovery schedule
#   redis          Celery broker / result backend
#   postgres       task state
#
# Scale independently, e.g. `docker compose up --scale devin-worker=3`.

x-app: &app
  build: .
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *app
    command: uv run alembic upgrade head
    restart: "no"

  api:
    <<: *app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 6

  ingest-worker:
    <<: *app
    command: uv run celery -A app.celery_app:celery_app worker -Q ingest -n ingest@%h --loglevel=info --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Persist the target-repo checkout between restarts. Pinned here so a
    # different SEMGREP_CHECKOUT_DIR in .env can't silently bypass the volume.
    environment:
      SEMGREP_CHECKOUT_DIR: /tmp/remediation-checkout
    volumes:
      - semgrep-checkout:/tmp/remediation-checkout

  devin-worker:
    <<: *app
    command: uv run celery -A app.celery_app:celery_app worker -Q devin -n devin@%h --loglevel=info --concurrency=4
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: uv run celery -A app.celery_app:celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remediation
      POSTGRES_PASSWORD: remediation
      POSTGRES_DB: remediation
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remediation -d remediation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  semgrep-checkout:
